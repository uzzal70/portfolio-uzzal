  <text x="110" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Hotel<tspan fill="#10B981">Lagbe</tspan></text>
  <text x="235" y="40" font-family="'JetBrains Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#10B981" letter-spacing="1">B2B &amp; B2C ENGINE</text>

