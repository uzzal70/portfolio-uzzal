  <text x="90" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#9C9CB2">Instant confirmation, agent credit ledger, and dynamic tariff matrix with zero double-booking.</text>

