  <text x="870" y="695" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9C9CB2">Net Agency Rate</text>
  <text x="870" y="725" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#10B981">৳14,200 <tspan font-size="12" font-weight="400" fill="#9C9CB2">/ night</tspan></text>
